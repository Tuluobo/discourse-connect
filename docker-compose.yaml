version: "3.8"

services:
  web:
    image: ghcr.io/tuluobo/discourse-connect:v0.1.0
    ports:
      - "3000:3000"
    restart: always
    env_file:
      - ./.env
    environment:
      NEXT_PUBLIC_HOST_URL: ${NEXT_PUBLIC_HOST_URL}
      AUTH_TRUST_HOST: true
      NEXTAUTH_URL: ${NEXT_PUBLIC_HOST_URL}
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      DISCOURSE_HOST: ${DISCOURSE_HOST}
      DISCOURSE_SECRET: ${DISCOURSE_SECRET}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: discourse_connect
      POSTGRES_USER: discourse_connect
      POSTGRES_PASSWORD: discourse_connect
    volumes:
      - discourse-connect-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  discourse-connect-db-data:
